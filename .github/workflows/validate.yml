name: Validate graph and diagnosis
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/validate.py
      - run: python scripts/build_statistics.py --check
      - run: python scripts/build_algebra.py --check
      - run: python scripts/build_algebra_d2.py --check
      - run: python -m unittest discover -s tests -p 'test_*build.py'
      - run: node tests/test_engine.js
      - run: python scripts/verify_questions.py --file data/questions.json --report /tmp/current-verification.json
